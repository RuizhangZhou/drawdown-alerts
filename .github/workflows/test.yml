name: Test investment monitor

on:
  pull_request:
  push:
    branches: ['work/actions-migration']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Public market data connectivity (no Matrix credentials)
        run: |
          python -c 'from asset_monitor.data_sources import fetch_binance_klines, fetch_yf_close; assert len(fetch_binance_klines()) > 2; assert len(fetch_yf_close("GLD")) > 2; assert len(fetch_yf_close("SPY")) > 2; print("BTC/GLD/SPY data reachable from GitHub runner")'
