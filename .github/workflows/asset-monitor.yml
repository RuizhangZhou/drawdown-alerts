name: Investment monitoring weekly Matrix report

on:
  schedule:
    # Preserve the former server schedule: Monday 03:30 UTC.
    - cron: '30 3 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate data and charts without sending or writing state'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: investment-monitor-production
  cancel-in-progress: false

jobs:
  report:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || vars.INVESTMENT_MONITOR_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASSET_STATE_BACKEND: matrix
      MPLBACKEND: Agg
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Run report (secrets available only to this step)
        env:
          MATRIX_HOMESERVER: ${{ secrets.MATRIX_HOMESERVER }}
          MATRIX_ROOM_ID: ${{ secrets.MATRIX_ROOM_ID }}
          MATRIX_ACCESS_TOKEN: ${{ secrets.MATRIX_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--daily-report --send-charts)
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          python -m asset_monitor.main "${args[@]}"
